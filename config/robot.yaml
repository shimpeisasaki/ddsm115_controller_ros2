velocity_control_node:
  ros__parameters:
    usb_dev: /dev/ttyUSB0
    max_check: 2
    command_timeout: 2.0

two_wheels_robot_node:
  ros__parameters:
    wheel_base: 0.207
    R_wheel: 0.051
    pub_tf: false
    joystick_timeout: 2.0
    feedback_timeout: 0.2
    enable_joystick: true
    left_motor_id: 1
    right_motor_id: 2
    left_direction: 1
    right_direction: -1

motor_test_gui:
  ros__parameters:
    usb_dev: /dev/ttyUSB0
    max_check: 2
    command_timeout: 2.0
    wheel_base: 0.207
    wheel_radius: 0.051
    left_motor_id: 1
    right_motor_id: 2
    left_direction: 1
    right_direction: -1
    rpm_step: 5
    max_test_rpm: 330
    linear_step: 0.02
    angular_step: 0.1
    max_linear_speed: 1.762
    max_angular_speed: 2.0
    control_period: 0.1
    joystick_deadzone: 0.1
    gui_joystick_timeout: 0.5
